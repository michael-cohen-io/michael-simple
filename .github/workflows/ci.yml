name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, typecheck, build and smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run build
      - run: bunx playwright install --with-deps chromium
      - run: bun run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
      - run: bun install --frozen-lockfile
      # Advisory only for now: every remaining advisory is in next 14 or the
      # ESLint 8 / Tailwind 3 dev chain, which PRs 09-11 replace. Until then a
      # non-empty report is a warning and the job summary, not a failed step,
      # so a green run does not carry a red step. PR 09 turns this back into a
      # plain, blocking `bun audit --audit-level=high`.
      - name: bun audit (advisory)
        run: |
          set -o pipefail
          if NO_COLOR=1 bun audit --audit-level=high | tee audit.txt; then
            exit 0
          fi
          { echo '```'; cat audit.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          echo "::warning title=Dependency audit::High or critical advisories remain (see the job summary). Advisory until the Next 15 / ESLint 9 upgrade lands."
